<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/a8156b8a54.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="src/styles/normalize.css" />
    <link rel="stylesheet" href="src/styles/form.css" />
    <title>Book a Consultation - Form</title>
  </head>
  <body>
    <div class="container">
      <h2>
        <span class="header-dot">.</span> Book a Consultation
        <span class="header-dot">.</span>
      </h2>
      <form action="/">
        <!-- Input for customer name -->
        <label for="name">Full name:<span class="red">*</span></label>
        <input type="text" id="name" placeholder="Ex: John Smith" required />
        <!-- Input for customer email -->
        <label for="email">Email:<span class="red">*</span></label>
        <input
          type="email"
          id="email"
          placeholder="Ex: johnsmith@gmail.com"
          required
        />
        <!-- Input for customer phone number -->
        <label for="phone">Phone: (Optional)</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          pattern="[0-9]{10}"
          placeholder="Ex: 0712345678"
        />
        <!-- Input for customer address -->
        <label for="address">Address:<span class="red">*</span></label>
        <input
          type="text"
          id="address"
          placeholder="Ex: 1 Santa Lane"
          required
        />
        <!-- Dropdown to chose country of residence -->
        <div class="select-container">
          <label for="country">Country:<span class="red">*</span></label>
          <i class="fa-regular fa-hand-point-down icon"></i>
          <select name="country" id="country" required>
            <option value="Sweden">Sweden</option>
            <option value="Norway">Norway</option>
            <option value="Finland">Finland</option>
            <option value="Denmark">Denmark</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <!-- Input for customer post code -->
        <label for="post-code">Post Code:<span class="red">*</span></label>
        <input type="text" pattern="[0-9]{5}" id="post-code" required />
        <!-- Input for additional information -->
        <label for="message">Message:</label>
        <textarea
          name="message"
          id="message"
          rows="5"
          placeholder="Any additional information"
        ></textarea>
        <!-- Newsletter option - checkbox -->
        <div class="checkbox-container">
          <input type="checkbox" id="newsletter" checked />
          <label for="newsletter">Sign up to our super real newsletter!</label>
        </div>
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
